<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel Stats - RIST Sender</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --bg-hover: #22222e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-orange: #f97316;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-yellow: #eab308;
            --border-color: #2a2a3a;
            --card-radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.running {
            background: rgba(34, 197, 94, 0.2);
            color: var(--accent-green);
        }

        .status-badge.stopped {
            background: rgba(160, 160, 176, 0.2);
            color: var(--text-secondary);
        }

        .main-content {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 1.25rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .stat-value.green { color: var(--accent-green); }
        .stat-value.red { color: var(--accent-red); }
        .stat-value.orange { color: var(--accent-orange); }
        .stat-value.blue { color: var(--accent-blue); }

        .section {
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 1.5rem;
            height: 300px;
        }

        .peers-grid {
            display: grid;
            gap: 1rem;
        }

        .peer-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 1.25rem;
        }

        .peer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .peer-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .peer-id {
            color: var(--text-secondary);
            font-size: 12px;
            background: var(--bg-hover);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .peer-quality {
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .peer-quality.good {
            background: rgba(34, 197, 94, 0.2);
            color: var(--accent-green);
        }

        .peer-quality.warning {
            background: rgba(234, 179, 8, 0.2);
            color: var(--accent-yellow);
        }

        .peer-quality.bad {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
        }

        .peer-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
        }

        .peer-stat-item {
            text-align: center;
        }

        .peer-stat-label {
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
        }

        .peer-stat-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Client/Peer hierarchy styles */
        .clients-container {
            display: grid;
            gap: 1rem;
        }

        .client-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            overflow: hidden;
        }

        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            background: var(--bg-hover);
            border-bottom: 1px solid var(--border-color);
        }

        .client-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .client-quality {
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .client-quality.good {
            background: rgba(34, 197, 94, 0.2);
            color: var(--accent-green);
        }

        .client-quality.warning {
            background: rgba(234, 179, 8, 0.2);
            color: var(--accent-yellow);
        }

        .client-quality.bad {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
        }

        .client-totals {
            display: flex;
            gap: 1.5rem;
            padding: 0.75rem 1.25rem;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 13px;
            border-bottom: 1px solid var(--border-color);
        }

        .peers-list {
            padding: 0.75rem 1.25rem;
        }

        .peer-row {
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .peer-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .peer-row:first-child {
            padding-top: 0;
        }

        .peer-row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .peer-row-id {
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .peer-row-quality {
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .peer-row-quality.good {
            background: rgba(34, 197, 94, 0.15);
            color: var(--accent-green);
        }

        .peer-row-quality.warning {
            background: rgba(234, 179, 8, 0.15);
            color: var(--accent-yellow);
        }

        .peer-row-quality.bad {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
        }

        .peer-row-stats {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .peer-row-stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .peer-row-label {
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
        }

        .peer-row-value {
            font-weight: 500;
            font-size: 13px;
        }

        .logs-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 1rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-line {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            padding: 2px 0;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-success {
            background: var(--accent-green);
            color: white;
        }

        .btn-danger {
            background: var(--accent-red);
            color: white;
        }

        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="/" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back to Dashboard
            </a>
            <div class="header-title">
                <h1 id="channel-name">Loading...</h1>
                <span class="status-badge stopped" id="status-badge">Stopped</span>
            </div>
            <div class="header-actions">
                <button class="btn btn-success" id="start-btn" onclick="startChannel()">Start</button>
                <button class="btn btn-danger" id="stop-btn" onclick="stopChannel()" style="display:none;">Stop</button>
                <a class="btn btn-secondary" id="edit-btn" href="#">Edit</a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Quality</div>
                <div class="stat-value green" id="quality">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Bandwidth</div>
                <div class="stat-value blue" id="bandwidth">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Packets Sent</div>
                <div class="stat-value" id="packets-sent">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Retransmitted</div>
                <div class="stat-value orange" id="retransmitted">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">RTT</div>
                <div class="stat-value" id="rtt">-</div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 20V10M12 20V4M6 20v-6"/>
                </svg>
                Bandwidth Over Time
            </h2>
            <div class="chart-container">
                <canvas id="bandwidth-chart"></canvas>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 6v6l4 2"/>
                </svg>
                Connected Clients
            </h2>
            <div class="clients-container" id="clients-container">
                <p style="color: var(--text-secondary);">Loading clients...</p>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 19h16M4 15h16M4 11h16M4 7h16"/>
                </svg>
                Recent Logs
            </h2>
            <div class="logs-container" id="logs-container">
                <p style="color: var(--text-secondary);">Loading logs...</p>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = window.location.origin + '/api';
        let channelId = null;
        let channel = null;
        let bandwidthChart = null;
        let bandwidthHistory = [];

        function getChannelIdFromUrl() {
            const path = window.location.pathname;
            const match = path.match(/\/stats\/(.+)/);
            return match ? match[1] : null;
        }

        async function checkAuth() {
            try {
                const response = await fetch(`${API_BASE}/auth/status`, { credentials: 'include' });
                const data = await response.json();
                if (!data.authenticated) {
                    window.location.href = '/login';
                }
            } catch (error) {
                window.location.href = '/login';
            }
        }

        async function loadChannel() {
            try {
                const response = await fetch(`${API_BASE}/channels/${channelId}`, { credentials: 'include' });
                if (response.status === 404) {
                    alert('Channel not found');
                    window.location.href = '/';
                    return;
                }
                channel = await response.json();
                updateHeader();
            } catch (error) {
                console.error('Failed to load channel:', error);
            }
        }

        function updateHeader() {
            document.getElementById('channel-name').textContent = channel.name || channelId;
            document.getElementById('edit-btn').href = `/edit/${channelId}`;

            const badge = document.getElementById('status-badge');
            const startBtn = document.getElementById('start-btn');
            const stopBtn = document.getElementById('stop-btn');

            if (channel.status === 'running') {
                badge.className = 'status-badge running';
                badge.textContent = 'Running';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-flex';
            } else {
                badge.className = 'status-badge stopped';
                badge.textContent = 'Stopped';
                startBtn.style.display = 'inline-flex';
                stopBtn.style.display = 'none';
            }
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/channels/${channelId}/stats`, { credentials: 'include' });
                const stats = await response.json();
                updateStats(stats);
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        function updateStats(stats) {
            document.getElementById('quality').textContent = stats.quality.toFixed(1) + '%';
            document.getElementById('bandwidth').textContent = formatBandwidth(stats.bandwidth_bps);
            document.getElementById('packets-sent').textContent = formatNumber(stats.packets.sent);
            document.getElementById('retransmitted').textContent = formatNumber(stats.packets.retransmitted);
            document.getElementById('rtt').textContent = stats.timing.rtt.toFixed(1) + ' ms';

            // Update quality color
            const qualityEl = document.getElementById('quality');
            if (stats.quality >= 99) {
                qualityEl.className = 'stat-value green';
            } else if (stats.quality >= 95) {
                qualityEl.className = 'stat-value orange';
            } else {
                qualityEl.className = 'stat-value red';
            }

            // Update bandwidth chart
            bandwidthHistory.push(stats.bandwidth_bps / 1000000);
            if (bandwidthHistory.length > 60) bandwidthHistory.shift();
            updateBandwidthChart();

            // Update clients
            renderClients(stats.clients || []);
        }

        function renderClients(clients) {
            const container = document.getElementById('clients-container');

            if (clients.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary);">No connected clients</p>';
                return;
            }

            container.innerHTML = clients.map(client => {
                let qualityClass = 'good';
                if (client.totals.quality < 99) qualityClass = 'warning';
                if (client.totals.quality < 95) qualityClass = 'bad';

                const peersHtml = client.peers.map(peer => {
                    let peerQualityClass = 'good';
                    if (peer.quality < 99) peerQualityClass = 'warning';
                    if (peer.quality < 95) peerQualityClass = 'bad';

                    return `
                        <div class="peer-row">
                            <div class="peer-row-header">
                                <span class="peer-row-id">Peer ${peer.id}</span>
                                <span class="peer-row-quality ${peerQualityClass}">${peer.quality.toFixed(1)}%</span>
                            </div>
                            <div class="peer-row-stats">
                                <div class="peer-row-stat">
                                    <span class="peer-row-label">BW</span>
                                    <span class="peer-row-value">${formatBandwidth(peer.bandwidth_bps)}</span>
                                </div>
                                <div class="peer-row-stat">
                                    <span class="peer-row-label">Sent</span>
                                    <span class="peer-row-value">${formatNumber(peer.sent || 0)}</span>
                                </div>
                                <div class="peer-row-stat">
                                    <span class="peer-row-label">Retx</span>
                                    <span class="peer-row-value">${formatNumber(peer.retransmitted || 0)}</span>
                                </div>
                                <div class="peer-row-stat">
                                    <span class="peer-row-label">RTT</span>
                                    <span class="peer-row-value">${(peer.avg_rtt || peer.rtt || 0).toFixed(1)} ms</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="client-card">
                        <div class="client-header">
                            <div class="client-name">${client.cname}</div>
                            <span class="client-quality ${qualityClass}">${client.totals.quality.toFixed(1)}%</span>
                        </div>
                        <div class="client-totals">
                            <span>Total: ${formatBandwidth(client.totals.bandwidth_bps)}</span>
                            <span>RTT: ${client.totals.rtt.toFixed(1)} ms</span>
                        </div>
                        <div class="peers-list">
                            ${peersHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadLogs() {
            try {
                const response = await fetch(`${API_BASE}/channels/${channelId}/logs?lines=50`, { credentials: 'include' });
                const data = await response.json();
                const container = document.getElementById('logs-container');
                container.innerHTML = (data.logs || []).map(line =>
                    `<div class="log-line">${escapeHtml(line)}</div>`
                ).join('');
                container.scrollTop = container.scrollHeight;
            } catch (error) {
                console.error('Failed to load logs:', error);
            }
        }

        function initBandwidthChart() {
            const ctx = document.getElementById('bandwidth-chart').getContext('2d');
            bandwidthChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(60).fill(''),
                    datasets: [{
                        label: 'Bandwidth (Mbps)',
                        data: bandwidthHistory,
                        borderColor: '#f97316',
                        backgroundColor: 'rgba(249, 115, 22, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { display: false },
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#a0a0b0' }
                        }
                    }
                }
            });
        }

        function updateBandwidthChart() {
            if (bandwidthChart) {
                bandwidthChart.data.datasets[0].data = bandwidthHistory;
                bandwidthChart.update('none');
            }
        }

        async function startChannel() {
            try {
                await fetch(`${API_BASE}/channels/${channelId}/start`, {
                    method: 'POST',
                    credentials: 'include'
                });
                await loadChannel();
            } catch (error) {
                console.error('Failed to start:', error);
            }
        }

        async function stopChannel() {
            try {
                await fetch(`${API_BASE}/channels/${channelId}/stop`, {
                    method: 'POST',
                    credentials: 'include'
                });
                await loadChannel();
            } catch (error) {
                console.error('Failed to stop:', error);
            }
        }

        function formatBandwidth(bps) {
            if (bps >= 1000000) return (bps / 1000000).toFixed(2) + ' Mbps';
            if (bps >= 1000) return (bps / 1000).toFixed(1) + ' Kbps';
            return bps + ' bps';
        }

        function formatNumber(n) {
            if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
            return n.toString();
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            channelId = getChannelIdFromUrl();
            if (!channelId) {
                window.location.href = '/';
                return;
            }

            await loadChannel();
            initBandwidthChart();
            await loadStats();
            await loadLogs();

            setInterval(async () => {
                await loadChannel();
                await loadStats();
            }, 2000);

            setInterval(loadLogs, 5000);
        });
    </script>
</body>
</html>
