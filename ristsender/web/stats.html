<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel Stats - RIST Sender</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --bg-hover: #22222e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-orange: #f97316;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-yellow: #eab308;
            --border-color: #2a2a3a;
            --card-radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.running {
            background: rgba(34, 197, 94, 0.2);
            color: var(--accent-green);
        }

        .status-badge.stopped {
            background: rgba(160, 160, 176, 0.2);
            color: var(--text-secondary);
        }

        .main-content {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 1.25rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .stat-value.green { color: var(--accent-green); }
        .stat-value.red { color: var(--accent-red); }
        .stat-value.orange { color: var(--accent-orange); }
        .stat-value.blue { color: var(--accent-blue); }

        .section {
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 1.5rem;
            height: 300px;
        }

        .peers-grid {
            display: grid;
            gap: 1rem;
        }

        .peer-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 1.25rem;
        }

        .peer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .peer-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .peer-id {
            color: var(--text-secondary);
            font-size: 12px;
            background: var(--bg-hover);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .peer-quality {
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .peer-quality.good {
            background: rgba(34, 197, 94, 0.2);
            color: var(--accent-green);
        }

        .peer-quality.warning {
            background: rgba(234, 179, 8, 0.2);
            color: var(--accent-yellow);
        }

        .peer-quality.bad {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
        }

        .peer-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
        }

        .peer-stat-item {
            text-align: center;
        }

        .peer-stat-label {
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
        }

        .peer-stat-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Client/Peer hierarchy styles */
        .clients-container {
            display: grid;
            gap: 1rem;
        }

        .client-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            overflow: hidden;
        }

        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            background: var(--bg-hover);
            border-bottom: 1px solid var(--border-color);
        }

        .client-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .client-quality {
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .client-quality.good {
            background: rgba(34, 197, 94, 0.2);
            color: var(--accent-green);
        }

        .client-quality.warning {
            background: rgba(234, 179, 8, 0.2);
            color: var(--accent-yellow);
        }

        .client-quality.bad {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
        }

        .client-totals {
            display: flex;
            gap: 1.5rem;
            padding: 0.75rem 1.25rem;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 13px;
            border-bottom: 1px solid var(--border-color);
        }

        .peers-list {
            padding: 0.75rem 1.25rem;
        }

        .peer-row {
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .peer-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .peer-row:first-child {
            padding-top: 0;
        }

        .peer-row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .peer-row-id {
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .peer-row-quality {
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .peer-row-quality.good {
            background: rgba(34, 197, 94, 0.15);
            color: var(--accent-green);
        }

        .peer-row-quality.warning {
            background: rgba(234, 179, 8, 0.15);
            color: var(--accent-yellow);
        }

        .peer-row-quality.bad {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
        }

        .peer-row-stats {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .peer-row-stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .peer-row-label {
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
        }

        .peer-row-value {
            font-weight: 500;
            font-size: 13px;
        }

        .logs-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 1rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-line {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            padding: 2px 0;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-success {
            background: var(--accent-green);
            color: white;
        }

        .btn-danger {
            background: var(--accent-red);
            color: white;
        }

        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        /* LED Indicator */
        .led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 4px currentColor;
        }
        .led.green { background: var(--accent-green); color: var(--accent-green); }
        .led.yellow { background: var(--accent-yellow); color: var(--accent-yellow); }
        .led.red { background: var(--accent-red); color: var(--accent-red); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .modal-overlay.active,
        .modal-overlay.visible {
            opacity: 1;
            visibility: visible;
        }
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            width: 90%;
            max-width: 500px;
            transform: scale(0.9);
            transition: transform 0.3s;
        }
        .modal-overlay.active .modal,
        .modal-overlay.visible .modal {
            transform: scale(1);
        }
        .preview-modal-content {
            max-width: 800px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }
        .modal-title { font-size: 16px; font-weight: 600; }
        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }
        .modal-close:hover { color: var(--text-primary); }
        .modal-body { padding: 1.5rem; }

        .player-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .player-placeholder {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            gap: 12px;
        }
        .preview-info {
            display: flex;
            gap: 1.5rem;
            margin-top: 1rem;
            padding: 0.75rem;
            background: var(--bg-secondary);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="/" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back to Dashboard
            </a>
            <div class="header-title">
                <h1 id="channel-name">Loading...</h1>
                <span class="status-badge stopped" id="status-badge">Stopped</span>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="openPreview()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    Preview
                </button>
                <button class="btn btn-success" id="start-btn" onclick="startChannel()">Start</button>
                <button class="btn btn-danger" id="stop-btn" onclick="stopChannel()" style="display:none;">Stop</button>
                <a class="btn btn-secondary" id="edit-btn" href="#">Edit</a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Quality</div>
                <div class="stat-value green" id="quality">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Bandwidth</div>
                <div class="stat-value blue" id="bandwidth">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Packets Sent</div>
                <div class="stat-value" id="packets-sent">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Retransmitted</div>
                <div class="stat-value orange" id="retransmitted">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">RTT</div>
                <div class="stat-value" id="rtt">-</div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 20V10M12 20V4M6 20v-6"/>
                </svg>
                Bandwidth Over Time
            </h2>
            <div class="chart-container">
                <canvas id="bandwidth-chart"></canvas>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 6v6l4 2"/>
                </svg>
                Connected Clients
            </h2>
            <div class="clients-container" id="clients-container">
                <p style="color: var(--text-secondary);">Loading clients...</p>
            </div>
        </div>
    </main>

    <!-- Preview Modal - exact copy from index.html -->
    <div class="modal-overlay preview-modal" id="preview-modal">
        <div class="modal" style="max-width: 800px;">
            <div class="modal-header">
                <span class="modal-title">Preview: <span id="preview-channel-name"></span></span>
                <button class="modal-close" onclick="closePreview()">&times;</button>
            </div>
            <div class="modal-body" style="padding: 16px;">
                <div style="position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden;">
                    <video id="preview-video" style="width: 100%; height: 100%;" controls autoplay muted></video>
                    <div id="preview-loading" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-secondary); gap: 12px;">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                        <div id="preview-status">Starting preview...</div>
                    </div>
                </div>
                <div id="preview-info" style="display: none; margin-top: 12px; padding: 10px; background: var(--bg-secondary); border-radius: 8px; font-size: 13px; color: var(--text-secondary);">
                    <span id="preview-resolution">-</span> &bull; <span id="preview-bitrate">-</span>
                </div>
                <div id="preview-error" style="display: none; margin-top: 12px; padding: 10px; background: rgba(239, 68, 68, 0.1); border-radius: 8px; color: var(--accent-red); font-size: 13px;"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        let channelId = null;
        let channel = null;
        let bandwidthChart = null;
        let bandwidthHistory = [];

        function getChannelIdFromUrl() {
            const path = window.location.pathname;
            const match = path.match(/\/stats\/(.+)/);
            return match ? match[1] : null;
        }

        async function checkAuth() {
            try {
                const response = await fetch(`${API_BASE}/auth/status`, { credentials: 'include' });
                const data = await response.json();
                if (!data.authenticated) {
                    window.location.href = '/login';
                }
            } catch (error) {
                window.location.href = '/login';
            }
        }

        async function loadChannel() {
            try {
                const response = await fetch(`${API_BASE}/channels/${channelId}`, { credentials: 'include' });
                if (response.status === 404) {
                    alert('Channel not found');
                    window.location.href = '/';
                    return;
                }
                channel = await response.json();
                updateHeader();
            } catch (error) {
                console.error('Failed to load channel:', error);
            }
        }

        function updateHeader() {
            document.getElementById('channel-name').textContent = channel.name || channelId;
            document.getElementById('edit-btn').href = `/edit/${channelId}`;

            const badge = document.getElementById('status-badge');
            const startBtn = document.getElementById('start-btn');
            const stopBtn = document.getElementById('stop-btn');

            if (channel.status === 'running') {
                badge.className = 'status-badge running';
                badge.textContent = 'Running';
                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-flex';
            } else {
                badge.className = 'status-badge stopped';
                badge.textContent = 'Stopped';
                startBtn.style.display = 'inline-flex';
                stopBtn.style.display = 'none';
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch(`${API_BASE}/channels/${channelId}/stats/history?minutes=60`, { credentials: 'include' });
                const data = await response.json();
                if (data.history && data.history.length > 0) {
                    // Populate bandwidth history from stored data
                    bandwidthHistory = data.history.map(p => p.bandwidth_bps / 1000000);
                    updateBandwidthChart();
                    console.log(`Loaded ${data.history.length} history points`);
                }
            } catch (error) {
                console.error('Failed to load history:', error);
            }
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/channels/${channelId}/stats`, { credentials: 'include' });
                const stats = await response.json();
                updateStats(stats);
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        function updateStats(stats) {
            document.getElementById('quality').textContent = stats.quality.toFixed(1) + '%';
            document.getElementById('bandwidth').textContent = formatBandwidth(stats.bandwidth_bps);
            document.getElementById('packets-sent').textContent = formatNumber(stats.packets.sent);
            document.getElementById('retransmitted').textContent = formatNumber(stats.packets.retransmitted);
            document.getElementById('rtt').textContent = stats.timing.rtt.toFixed(1) + ' ms';

            // Update quality color
            const qualityEl = document.getElementById('quality');
            if (stats.quality >= 99) {
                qualityEl.className = 'stat-value green';
            } else if (stats.quality >= 95) {
                qualityEl.className = 'stat-value orange';
            } else {
                qualityEl.className = 'stat-value red';
            }

            // Update bandwidth chart
            bandwidthHistory.push(stats.bandwidth_bps / 1000000);
            if (bandwidthHistory.length > 60) bandwidthHistory.shift();
            updateBandwidthChart();

            // Update clients
            renderClients(stats.clients || []);
        }

        function renderClients(clients) {
            const container = document.getElementById('clients-container');

            if (clients.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary);">No connected clients</p>';
                return;
            }

            container.innerHTML = clients.map(client => {
                let qualityClass = 'good';
                if (client.totals.quality < 99) qualityClass = 'warning';
                if (client.totals.quality < 95) qualityClass = 'bad';

                const peersHtml = client.peers.map(peer => {
                    let ledClass = 'green';
                    if (peer.quality < 99) ledClass = 'yellow';
                    if (peer.quality < 95) ledClass = 'red';

                    return `
                        <div class="peer-row">
                            <div class="peer-row-header">
                                <span class="peer-row-id"><span class="led ${ledClass}"></span>Peer ${peer.id}</span>
                                <span class="peer-row-quality ${ledClass === 'green' ? 'good' : ledClass === 'yellow' ? 'warning' : 'bad'}">${peer.quality.toFixed(1)}%</span>
                            </div>
                            <div class="peer-row-stats">
                                <div class="peer-row-stat">
                                    <span class="peer-row-label">BW</span>
                                    <span class="peer-row-value">${formatBandwidth(peer.bandwidth_bps)}</span>
                                </div>
                                <div class="peer-row-stat">
                                    <span class="peer-row-label">Sent</span>
                                    <span class="peer-row-value">${formatNumber(peer.sent || 0)}</span>
                                </div>
                                <div class="peer-row-stat">
                                    <span class="peer-row-label">Retx</span>
                                    <span class="peer-row-value">${formatNumber(peer.retransmitted || 0)}</span>
                                </div>
                                <div class="peer-row-stat">
                                    <span class="peer-row-label">RTT</span>
                                    <span class="peer-row-value">${(peer.avg_rtt || peer.rtt || 0).toFixed(1)} ms</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="client-card">
                        <div class="client-header">
                            <div class="client-name">${client.cname}</div>
                            <span class="client-quality ${qualityClass}">${client.totals.quality.toFixed(1)}%</span>
                        </div>
                        <div class="client-totals">
                            <span>Total: ${formatBandwidth(client.totals.bandwidth_bps)}</span>
                            <span>RTT: ${client.totals.rtt.toFixed(1)} ms</span>
                        </div>
                        <div class="peers-list">
                            ${peersHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function initBandwidthChart() {
            const ctx = document.getElementById('bandwidth-chart').getContext('2d');
            bandwidthChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Bandwidth (Mbps)',
                        data: bandwidthHistory,
                        borderColor: '#f97316',
                        backgroundColor: 'rgba(249, 115, 22, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            display: true,
                            grid: { color: 'rgba(255,255,255,0.03)' },
                            ticks: {
                                color: '#a0a0b0',
                                maxTicksLimit: 6,
                                font: { size: 10 }
                            }
                        },
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#a0a0b0' }
                        }
                    }
                }
            });
        }

        function updateBandwidthChart() {
            if (bandwidthChart) {
                // Generate time labels based on data length
                const now = new Date();
                const labels = bandwidthHistory.map((_, i) => {
                    const secondsAgo = (bandwidthHistory.length - 1 - i) * 2;  // 2 sec intervals
                    const time = new Date(now.getTime() - secondsAgo * 1000);
                    return time.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                });
                bandwidthChart.data.labels = labels;
                bandwidthChart.data.datasets[0].data = bandwidthHistory;
                bandwidthChart.update('none');
            }
        }

        async function startChannel() {
            try {
                await fetch(`${API_BASE}/channels/${channelId}/start`, {
                    method: 'POST',
                    credentials: 'include'
                });
                await loadChannel();
            } catch (error) {
                console.error('Failed to start:', error);
            }
        }

        async function stopChannel() {
            try {
                await fetch(`${API_BASE}/channels/${channelId}/stop`, {
                    method: 'POST',
                    credentials: 'include'
                });
                await loadChannel();
            } catch (error) {
                console.error('Failed to stop:', error);
            }
        }

        function formatBandwidth(bps) {
            if (bps >= 1000000) return (bps / 1000000).toFixed(2) + ' Mbps';
            if (bps >= 1000) return (bps / 1000).toFixed(1) + ' Kbps';
            return bps + ' bps';
        }

        function formatNumber(n) {
            if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
            return n.toString();
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Preview functions - exact copy from index.html
        let previewHls = null;
        let previewKeepaliveInterval = null;

        function openPreview() {
            document.getElementById('preview-channel-name').textContent = channel?.name || channelId;
            document.getElementById('preview-modal').classList.add('visible');
            document.getElementById('preview-loading').style.display = 'flex';
            document.getElementById('preview-error').style.display = 'none';
            document.getElementById('preview-info').style.display = 'none';
            document.getElementById('preview-status').textContent = 'Starting preview...';
            startPreview();
        }

        async function startPreview() {
            try {
                const response = await fetch(`${API_BASE}/channels/${channelId}/preview/start`, {
                    method: 'POST',
                    credentials: 'include'
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || 'Failed to start preview');
                }

                document.getElementById('preview-status').textContent = 'Loading stream...';

                previewKeepaliveInterval = setInterval(() => sendPreviewKeepalive(channelId), 10000);

                startHlsPlayback(channelId);
            } catch (error) {
                console.error('Preview error:', error);
                document.getElementById('preview-loading').style.display = 'none';
                document.getElementById('preview-error').style.display = 'block';
                document.getElementById('preview-error').textContent = error.message;
            }
        }

        function startHlsPlayback(chId) {
            const video = document.getElementById('preview-video');
            const hlsUrl = `${API_BASE}/channels/${chId}/preview/stream.m3u8`;

            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                previewHls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 30,
                    manifestLoadingMaxRetry: 2,
                    manifestLoadingRetryDelay: 1000,
                    levelLoadingMaxRetry: 2,
                    levelLoadingRetryDelay: 1000
                });

                console.log('HLS: Loading source', hlsUrl);
                previewHls.loadSource(hlsUrl);
                previewHls.attachMedia(video);

                previewHls.on(Hls.Events.MANIFEST_PARSED, () => {
                    console.log('HLS: Manifest parsed successfully');
                    document.getElementById('preview-loading').style.display = 'none';
                    video.play();
                    fetchPreviewInfo(chId);
                });

                previewHls.on(Hls.Events.ERROR, (event, data) => {
                    console.log('HLS Error:', data.type, data.details, 'fatal:', data.fatal);
                    if (data.fatal) {
                        console.log('Fatal error - destroying and retrying in 2s');
                        document.getElementById('preview-status').textContent = 'Stream error - retrying...';
                        document.getElementById('preview-loading').style.display = 'flex';
                        previewHls.destroy();
                        previewHls = null;
                        setTimeout(() => {
                            if (channelId) {
                                console.log('Retrying startHlsPlayback...');
                                startHlsPlayback(chId);
                            }
                        }, 2000);
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = hlsUrl;
                video.addEventListener('loadedmetadata', () => {
                    document.getElementById('preview-loading').style.display = 'none';
                    video.play();
                    fetchPreviewInfo(chId);
                });
            } else {
                document.getElementById('preview-loading').style.display = 'none';
                document.getElementById('preview-error').style.display = 'block';
                document.getElementById('preview-error').textContent = 'HLS not supported in this browser';
            }
        }

        async function fetchPreviewInfo(chId) {
            try {
                const response = await fetch(`${API_BASE}/channels/${chId}/preview/info`, {
                    credentials: 'include'
                });
                if (response.ok) {
                    const info = await response.json();
                    document.getElementById('preview-info').style.display = 'block';
                    document.getElementById('preview-resolution').textContent = `${info.width}x${info.height}`;
                    document.getElementById('preview-bitrate').textContent = `${(info.bitrate / 1000000).toFixed(2)} Mbps`;
                }
            } catch (error) {
                console.error('Failed to fetch preview info:', error);
            }
        }

        async function sendPreviewKeepalive(chId) {
            try {
                await fetch(`${API_BASE}/channels/${chId}/preview/keepalive`, {
                    method: 'POST',
                    credentials: 'include'
                });
            } catch (error) {
                console.error('Keepalive error:', error);
            }
        }

        function closePreview() {
            document.getElementById('preview-modal').classList.remove('visible');

            if (previewKeepaliveInterval) {
                clearInterval(previewKeepaliveInterval);
                previewKeepaliveInterval = null;
            }

            if (previewHls) {
                previewHls.destroy();
                previewHls = null;
            }

            const video = document.getElementById('preview-video');
            video.pause();
            video.src = '';
        }

        // Close modal on overlay click
        document.getElementById('preview-modal').addEventListener('click', function(e) {
            if (e.target === this) closePreview();
        });

        // Close modal on Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closePreview();
        });

        // Clean up preview when leaving page
        window.addEventListener('beforeunload', closePreview);

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            channelId = getChannelIdFromUrl();
            if (!channelId) {
                window.location.href = '/';
                return;
            }

            await loadChannel();
            initBandwidthChart();
            await loadHistory();  // Load historic data first
            await loadStats();

            setInterval(async () => {
                await loadChannel();
                await loadStats();
            }, 2000);
        });
    </script>
</body>
</html>
