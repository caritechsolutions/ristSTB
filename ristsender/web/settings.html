<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - RIST Sender</title>
    <link rel="icon" href="/favicon.ico" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --bg-hover: #22222e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-orange: #f97316;
            --border-color: #2a2a3a;
            --card-radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .back-link:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        h1 { font-size: 1.25rem; }

        .main-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-orange);
        }

        .form-help {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent-orange);
            color: white;
        }

        .btn-primary:hover {
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 1.5rem;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.15);
            color: var(--accent-green);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 1rem;
            display: none;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="/" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Back
            </a>
            <h1>Settings</h1>
        </div>
    </header>

    <main class="main-content">
        <div class="section">
            <h2 class="section-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
                Preview Transcoding
            </h2>
            <div class="form-group">
                <label class="form-label">Preview Bitrate (Kbps)</label>
                <input type="number" id="preview-bitrate" class="form-input" min="500" max="10000" step="100" value="2000">
                <div class="form-help">Bitrate for HLS preview transcoding. Lower values reduce bandwidth but may affect quality. Default: 2000 Kbps</div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                Change Password
            </h2>
            <div class="form-group">
                <label class="form-label">Current Password</label>
                <input type="password" id="current-password" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" id="new-password" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" id="confirm-password" class="form-input">
            </div>
            <button class="btn btn-secondary" onclick="changePassword()">Change Password</button>
            <div id="password-success" class="success-message">Password changed successfully</div>
            <div id="password-error" class="error-message"></div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
        </div>

        <div id="settings-success" class="success-message">Settings saved successfully</div>
        <div id="settings-error" class="error-message"></div>
    </main>

    <script>
        const API_BASE = window.location.origin + '/api';

        async function checkAuth() {
            try {
                const response = await fetch(`${API_BASE}/auth/status`, { credentials: 'include' });
                const data = await response.json();
                if (!data.authenticated) {
                    window.location.href = '/login';
                }
            } catch (error) {
                window.location.href = '/login';
            }
        }

        async function loadSettings() {
            try {
                const response = await fetch(`${API_BASE}/settings`, { credentials: 'include' });
                if (response.ok) {
                    const settings = await response.json();
                    document.getElementById('preview-bitrate').value = settings.preview_bitrate || 2000;
                }
            } catch (error) {
                console.error('Failed to load settings:', error);
            }
        }

        async function saveSettings() {
            const successEl = document.getElementById('settings-success');
            const errorEl = document.getElementById('settings-error');
            successEl.style.display = 'none';
            errorEl.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/settings`, {
                    method: 'PUT',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        preview_bitrate: parseInt(document.getElementById('preview-bitrate').value)
                    })
                });

                if (response.ok) {
                    successEl.style.display = 'block';
                    setTimeout(() => { successEl.style.display = 'none'; }, 3000);
                } else {
                    const data = await response.json();
                    errorEl.textContent = data.detail || 'Failed to save settings';
                    errorEl.style.display = 'block';
                }
            } catch (error) {
                errorEl.textContent = 'Failed to save settings';
                errorEl.style.display = 'block';
            }
        }

        async function changePassword() {
            const current = document.getElementById('current-password').value;
            const newPass = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;
            const successEl = document.getElementById('password-success');
            const errorEl = document.getElementById('password-error');

            successEl.style.display = 'none';
            errorEl.style.display = 'none';

            if (!current || !newPass || !confirm) {
                errorEl.textContent = 'All fields are required';
                errorEl.style.display = 'block';
                return;
            }

            if (newPass !== confirm) {
                errorEl.textContent = 'New passwords do not match';
                errorEl.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/password`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ current_password: current, new_password: newPass })
                });

                if (response.ok) {
                    successEl.style.display = 'block';
                    document.getElementById('current-password').value = '';
                    document.getElementById('new-password').value = '';
                    document.getElementById('confirm-password').value = '';
                    setTimeout(() => { successEl.style.display = 'none'; }, 3000);
                } else {
                    const data = await response.json();
                    errorEl.textContent = data.detail || 'Failed to change password';
                    errorEl.style.display = 'block';
                }
            } catch (error) {
                errorEl.textContent = 'Failed to change password';
                errorEl.style.display = 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            await loadSettings();
        });
    </script>
</body>
</html>
